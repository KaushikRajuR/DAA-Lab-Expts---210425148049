<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pattern Analysis Dashboard</title>
<style>
  :root {
    --bg-color: #fdf6f0;       /* Soft Light Peach */
    --card-bg: #ffffff;        /* Crisp White Container */
    --accent-dark: #3a2238;    /* Deep Plum / Dark Violet */
    --accent-glow: #522d50;    /* Dark Plum Hover */
    --text-primary: #2d1a2c;   /* Deep Slate-Violet Text */
    --text-muted: #735d72;     /* Soft Muted Text */
    --border-color: #f2cc8f;   /* Soft Peach Border */
    --panel-bg: #fffbf7;       /* Off-White Panel */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 850px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(58, 34, 56, 0.08);
    border: 1px solid rgba(242, 204, 143, 0.5);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent-glow));
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }

  .header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header p {
    margin: 8px 0 0;
    font-size: 0.95rem;
    opacity: 0.85;
    color: #f9ecec;
  }

  .main {
    padding: 28px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  textarea, input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--panel-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s ease;
    outline: none;
  }

  textarea {
    resize: vertical;
    min-height: 80px;
  }

  textarea:focus, input:focus {
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(58, 34, 56, 0.1);
    background: #fff;
  }

  button {
    margin-top: 20px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(58, 34, 56, 0.2);
  }

  button:hover {
    background: var(--accent-glow);
    transform: translateY(-1px);
  }

  .table-container {
    margin-top: 24px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th {
    background: var(--accent-dark);
    color: #fff;
    padding: 14px;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: left;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(242, 204, 143, 0.4);
    color: var(--text-primary);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:nth-child(even) {
    background: #fffbf7;
  }

  .win {
    margin-top: 20px;
    padding: 16px 20px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--accent-dark);
    color: var(--accent-dark);
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .badge-yes {
    background: rgba(58, 34, 56, 0.1);
    color: var(--accent-dark);
  }

  .badge-no {
    background: rgba(186, 24, 24, 0.1);
    color: #a81c1c;
  }

  .footer {
    text-align: center;
    padding: 16px;
    background: var(--panel-bg);
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="header">
      <h1>⚡ Pattern Analysis Dashboard</h1>
      <p>Performance comparison across string search algorithms</p>
    </div>

    <div class="main">
      <div class="form-grid">
        <div>
          <label for="txt">Source Text</label>
          <textarea id="txt" rows="3" placeholder="Enter target string to search within..."></textarea>
        </div>

        <div>
          <label for="pat">Search Pattern</label>
          <input id="pat" placeholder="Enter pattern string...">
        </div>
      </div>

      <button onclick="runAnalysis()">Analyze Performance</button>

      <div id="output"></div>
    </div>

    <div class="footer">String Algorithm Analytics System</div>
  </div>
</div>

<script>
function runAnalysis(){
  const text = document.getElementById("txt").value;
  const pattern = document.getElementById("pat").value;
  if (!text || !pattern) { alert("Please provide both target text and pattern."); return; }
  const data = [];

  let s = performance.now();
  let a = linearPatternScan(text, pattern);
  let e = performance.now();
  data.push({ name: "Naive", hit: a.positions.length ? "Yes" : "No", pos: a.positions.join(", ") || "-", cmp: a.comparisons, time: (e - s).toFixed(4) });

  s = performance.now();
  let b = rollingHashSearch(text, pattern);
  e = performance.now();
  data.push({ name: "Rabin-Karp", hit: b.positions.length ? "Yes" : "No", pos: b.positions.join(", ") || "-", cmp: b.comparisons, time: (e - s).toFixed(4) });

  s = performance.now();
  let c = prefixTableSearch(text, pattern);
  e = performance.now();
  data.push({ name: "KMP", hit: c.positions.length ? "Yes" : "No", pos: c.positions.join(", ") || "-", cmp: c.comparisons, time: (e - s).toFixed(4) });

  render(data);
}

function linearPatternScan(text, pattern){
  let positions = [], comparisons = 0;
  for (let i = 0; i <= text.length - pattern.length; i++){
    let j = 0;
    while (j < pattern.length){
      comparisons++;
      if (text[i + j] !== pattern[j]) break;
      j++;
    }
    if (j === pattern.length) positions.push(i);
  }
  return { positions, comparisons };
}

function asciiTotal(str){
  let sum = 0;
  for (let ch of str) sum += ch.charCodeAt(0);
  return sum;
}

function rollingHashSearch(text, pattern){
  let positions = [], comparisons = 0, target = asciiTotal(pattern);
  for (let i = 0; i <= text.length - pattern.length; i++){
    let seg = text.substring(i, i + pattern.length);
    comparisons++;
    if (asciiTotal(seg) === target && seg === pattern) positions.push(i);
  }
  return { positions, comparisons };
}

function buildPrefix(pattern){
  let table = new Array(pattern.length).fill(0), len = 0, i = 1;
  while (i < pattern.length){
    if (pattern[i] === pattern[len]){
      table[i++] = ++len;
    } else if (len){
      len = table[len - 1];
    } else {
      table[i++] = 0;
    }
  }
  return table;
}

function prefixTableSearch(text, pattern){
  let positions = [], comparisons = 0, lps = buildPrefix(pattern), i = 0, j = 0;
  while (i < text.length){
    comparisons++;
    if (text[i] === pattern[j]){
      i++; j++;
      if (j === pattern.length){
        positions.push(i - j);
        j = lps[j - 1];
      }
    } else if (j){
      j = lps[j - 1];
    } else {
      i++;
    }
  }
  return { positions, comparisons };
}

function render(rows){
  let best = rows.reduce((a, b) => parseFloat(a.time) < parseFloat(b.time) ? a : b);
  let html = `
    <div class="table-container">
      <table>
        <tr>
          <th>Algorithm</th>
          <th>Status</th>
          <th>Positions</th>
          <th>Comparisons</th>
          <th>Execution Time</th>
        </tr>`;
  rows.forEach(r => {
    const hitBadge = r.hit === "Yes" ? `<span class="badge badge-yes">Found</span>` : `<span class="badge badge-no">Not Found</span>`;
    html += `<tr>
      <td><strong>${r.name}</strong></td>
      <td>${hitBadge}</td>
      <td>${r.pos}</td>
      <td>${r.cmp}</td>
      <td>${r.time} ms</td>
    </tr>`;
  });
  html += `</table></div><div class="win">⚡ Fastest Algorithm: ${best.name} (${best.time} ms)</div>`;
  document.getElementById("output").innerHTML = html;
}
</script>
</body>
</html>

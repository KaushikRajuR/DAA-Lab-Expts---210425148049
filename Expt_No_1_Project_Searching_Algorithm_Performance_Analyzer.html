<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Algorithm Performance Analyzer</title>
<style>
  :root {
    --bg-color: #fdf6f0;       /* Soft Light Peach */
    --card-bg: #ffffff;        /* Crisp White Container */
    --accent-dark: #3a2238;    /* Deep Plum / Dark Violet */
    --accent-glow: #522d50;    /* Dark Plum Hover */
    --text-primary: #2d1a2c;   /* Deep Slate-Violet Text */
    --text-muted: #735d72;     /* Soft Muted Text */
    --border-color: #f2cc8f;   /* Soft Peach Border */
    --panel-bg: #fffbf7;       /* Off-White Panel */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .wrapper {
    width: 100%;
    max-width: 900px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(58, 34, 56, 0.08);
    border: 1px solid rgba(242, 204, 143, 0.5);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent-glow));
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }

  .header h1 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header p {
    margin: 8px 0 0;
    font-size: 0.95rem;
    opacity: 0.85;
    color: #f9ecec;
  }

  .main {
    padding: 28px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
  }

  @media (max-width: 600px) {
    .form-grid {
      grid-template-columns: 1fr;
    }
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-size: 0.85rem;
    font-weight: 700;
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: var(--panel-bg);
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: inherit;
    transition: all 0.2s ease;
    outline: none;
  }

  input:focus {
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(58, 34, 56, 0.1);
    background: #fff;
  }

  .button-group {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
  }

  button {
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(58, 34, 56, 0.2);
  }

  button:hover {
    background: var(--accent-glow);
    transform: translateY(-1px);
  }

  button.secondary {
    background: var(--panel-bg);
    color: var(--accent-dark);
    border: 1px solid var(--border-color);
    box-shadow: none;
  }

  button.secondary:hover {
    background: #fff;
  }

  .result-card {
    margin-top: 24px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--accent-dark);
    padding: 20px;
    border-radius: 10px;
    line-height: 1.8;
    font-size: 0.95rem;
  }

  .result-card h3 {
    margin-bottom: 12px;
    color: var(--accent-dark);
    font-size: 1.1rem;
  }

  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }

  .box {
    background: #fff;
    border: 1px solid var(--border-color);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
  }

  .table-container {
    margin-top: 24px;
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  th {
    background: var(--accent-dark);
    color: #fff;
    padding: 12px 14px;
    font-weight: 600;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  td {
    padding: 12px 14px;
    border-bottom: 1px solid rgba(242, 204, 143, 0.4);
    border-right: 1px solid rgba(242, 204, 143, 0.4);
    text-align: center;
    color: var(--text-primary);
  }

  td:last-child, th:last-child {
    border-right: none;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:nth-child(even) {
    background: #fffbf7;
  }

  .badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 0.75rem;
    font-weight: 700;
  }

  .badge-found {
    background: rgba(58, 34, 56, 0.1);
    color: var(--accent-dark);
  }

  .badge-notfound {
    background: rgba(186, 24, 24, 0.1);
    color: #a81c1c;
  }

  .footer {
    text-align: center;
    padding: 16px;
    background: var(--panel-bg);
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<div class="wrapper">
  <div class="card">
    <div class="header">
      <h1>🔍 Search Algorithm Analyzer</h1>
      <p>Interpolation Search vs. Binary Search Evaluation</p>
    </div>

    <div class="main">
      <div class="form-grid">
        <div>
          <label for="arrayInput">Array Elements (comma separated)</label>
          <input id="arrayInput" value="2, 5, 10, 15, 23, 35, 48, 60, 75, 90, 105, 120">
        </div>
        <div>
          <label for="targetInput">Target Value</label>
          <input id="targetInput" type="number" value="35">
        </div>
      </div>

      <div class="button-group">
        <button onclick="runSingleSearch()">Search Array</button>
        <button class="secondary" onclick="runPerformanceAnalysis()">Performance Analysis</button>
      </div>

      <div id="singleResult" class="result-card" style="display: none;"></div>
      <div id="analysisOutput"></div>
    </div>

    <div class="footer">Algorithm Analysis Suite</div>
  </div>
</div>

<script>
function interpolationSearch(arr, target) {
  let low = 0, high = arr.length - 1;
  let comparisons = 0;

  while (low <= high && target >= arr[low] && target <= arr[high]) {
    comparisons++;

    if (low === high) {
      if (arr[low] === target) return { index: low, comparisons };
      return { index: -1, comparisons };
    }

    let pos = low + Math.floor(((target - arr[low]) * (high - low)) / (arr[high] - arr[low]));

    if (arr[pos] === target) {
      return { index: pos, comparisons };
    } else if (arr[pos] < target) {
      low = pos + 1;
    } else {
      high = pos - 1;
    }
  }
  return { index: -1, comparisons };
}

function binarySearch(arr, target) {
  let low = 0, high = arr.length - 1;
  let comparisons = 0;

  while (low <= high) {
    comparisons++;
    let mid = Math.floor((low + high) / 2);

    if (arr[mid] === target) {
      return { index: mid, comparisons };
    } else if (arr[mid] < target) {
      low = mid + 1;
    } else {
      high = mid - 1;
    }
  }
  return { index: -1, comparisons };
}

function parseArrayInput() {
  const raw = document.getElementById("arrayInput").value;
  let arr = raw.split(",").map(n => Number(n.trim())).filter(n => !isNaN(n));
  arr.sort((a, b) => a - b);
  return arr;
}

function runSingleSearch() {
  const arr = parseArrayInput();
  const target = Number(document.getElementById("targetInput").value);

  if (!arr.length || isNaN(target)) {
    alert("Please provide a valid sorted array and a numeric target value.");
    return;
  }

  const isRes = interpolationSearch(arr, target);
  const bsRes = binarySearch(arr, target);

  const container = document.getElementById("singleResult");
  container.style.display = "block";

  const statusBadge = isRes.index !== -1 
    ? `<span class="badge badge-found">Found at Index ${isRes.index}</span>` 
    : `<span class="badge badge-notfound">Not Found</span>`;

  container.innerHTML = `
    <h3>Target Status: ${statusBadge}</h3>
    <b>Sorted Array:</b> [${arr.join(", ")}]<br>
    <b>Searching Target:</b> ${target}
    <div class="summary-grid">
      <div class="box">
        <b>Interpolation Search</b><br>
        Comparisons: <strong>${isRes.comparisons}</strong>
      </div>
      <div class="box">
        <b>Binary Search</b><br>
        Comparisons: <strong>${bsRes.comparisons}</strong>
      </div>
    </div>
  `;
}

function runPerformanceAnalysis() {
  const sizes = [1000, 5000, 10000, 50000, 100000];
  let results = [];

  sizes.forEach(size => {
    // Generate sorted array
    let arr = [];
    for (let i = 0; i < size; i++) {
      arr.push(Math.floor(Math.random() * size * 10));
    }
    arr.sort((a, b) => a - b);
    let target = arr[Math.floor(Math.random() * size)];

    // Interpolation Analysis
    let t0 = performance.now();
    let isRes;
    for (let i = 0; i < 100; i++) {
      isRes = interpolationSearch(arr, target);
    }
    let isTime = (performance.now() - t0) / 100;

    // Binary Analysis
    let t1 = performance.now();
    let bsRes;
    for (let i = 0; i < 100; i++) {
      bsRes = binarySearch(arr, target);
    }
    let bsTime = (performance.now() - t1) / 100;

    results.push({
      size,
      isTime: isTime.toFixed(4),
      bsTime: bsTime.toFixed(4),
      isComp: isRes.comparisons,
      bsComp: bsRes.comparisons
    });
  });

  let html = `
    <div class="table-container">
      <table>
        <tr>
          <th>Size</th>
          <th>IS Time (ms)</th>
          <th>BS Time (ms)</th>
          <th>IS Comparisons</th>
          <th>BS Comparisons</th>
        </tr>`;

  results.forEach(r => {
    html += `<tr>
      <td><strong>${r.size.toLocaleString()}</strong></td>
      <td>${r.isTime}</td>
      <td>${r.bsTime}</td>
      <td>${r.isComp}</td>
      <td>${r.bsComp}</td>
    </tr>`;
  });

  html += `</table></div>`;
  document.getElementById("analysisOutput").innerHTML = html;
}
</script>

</body>
</html>

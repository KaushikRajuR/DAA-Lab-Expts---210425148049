<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Warehouse Stock Analyzer</title>
<style>
  :root {
    --bg-color: #fdf6f0;       /* Soft Light Peach */
    --card-bg: #ffffff;        /* Crisp White Container */
    --accent-dark: #3a2238;    /* Deep Plum / Dark Violet */
    --accent-glow: #522d50;    /* Dark Plum Hover */
    --text-primary: #2d1a2c;   /* Deep Slate-Violet Text */
    --text-muted: #735d72;     /* Soft Muted Text */
    --border-color: #f2cc8f;   /* Soft Peach Border */
    --panel-bg: #fffbf7;       /* Off-White Panel */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .container {
    width: 100%;
    max-width: 850px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(58, 34, 56, 0.08);
    border: 1px solid rgba(242, 204, 143, 0.5);
    overflow: hidden;
  }

  .header {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent-glow));
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }

  .header h2 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .header p {
    margin: 8px 0 0;
    font-size: 0.95rem;
    opacity: 0.85;
    color: #f9ecec;
  }

  .main {
    padding: 28px;
  }

  .badge {
    display: inline-block;
    background: rgba(58, 34, 56, 0.08);
    color: var(--accent-dark);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 16px;
  }

  .table-container {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  th {
    background: var(--accent-dark);
    color: #fff;
    padding: 14px;
    font-weight: 600;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  td {
    padding: 12px 16px;
    border-bottom: 1px solid rgba(242, 204, 143, 0.4);
    text-align: center;
    color: var(--text-primary);
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:nth-child(even) {
    background: #fffbf7;
  }

  button {
    width: 100%;
    margin-top: 20px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(58, 34, 56, 0.2);
  }

  button:hover {
    background: var(--accent-glow);
    transform: translateY(-1px);
  }

  .result {
    margin-top: 24px;
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-left: 5px solid var(--accent-dark);
    padding: 20px;
    border-radius: 10px;
    line-height: 1.8;
    font-size: 0.95rem;
  }

  .result h3 {
    margin-bottom: 12px;
    color: var(--accent-dark);
    font-size: 1.1rem;
  }

  .footer {
    text-align: center;
    padding: 16px;
    background: var(--panel-bg);
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>📦 Warehouse Stock Analyzer</h2>
    <p>Divide & Conquer vs Sequential Scan Comparison</p>
  </div>

  <div class="main">
    <span class="badge">Current Warehouse Inventory</span>

    <div class="table-container">
      <table id="inventory">
        <tr>
          <th>Product Name</th>
          <th>Available Stock (Units)</th>
        </tr>
      </table>
    </div>

    <button onclick="analyze()">Analyze Inventory Performance</button>

    <div class="result" id="output" style="display:none;"></div>
  </div>

  <div class="footer">Warehouse Optimization System</div>
</div>

<script>
const inventory = [
  { product: "Rice Bags", stock: 82 },
  { product: "Wheat Bags", stock: 15 },
  { product: "Sugar Packs", stock: 4 },
  { product: "Cooking Oil", stock: 95 },
  { product: "Soap Boxes", stock: 36 },
  { product: "Biscuits", stock: 32 },
  { product: "Milk Powder", stock: 29 },
  { product: "Tea Packets", stock: 18 },
  { product: "Water Bottles", stock: 95 }
];

let compareCount = 0;

function loadTable() {
  const t = document.getElementById("inventory");
  inventory.forEach(item => {
    let r = t.insertRow();
    r.insertCell().textContent = item.product;
    r.insertCell().textContent = item.stock + " units";
  });
}

function divideSearch(arr, l, h) {
  if (l === h) return { min: arr[l], max: arr[l] };
  if (h === l + 1) {
    compareCount++;
    if (arr[l] < arr[h]) return { min: arr[l], max: arr[h] };
    return { min: arr[h], max: arr[l] };
  }
  let m = Math.floor((l + h) / 2);
  let a = divideSearch(arr, l, m);
  let b = divideSearch(arr, m + 1, h);

  compareCount++;
  let mn = a.min < b.min ? a.min : b.min;

  compareCount++;
  let mx = a.max > b.max ? a.max : b.max;

  return { min: mn, max: mx };
}

function sequential(arr) {
  let mn = arr[0], mx = arr[0], c = 0;
  for (let i = 1; i < arr.length; i++) {
    c++;
    if (arr[i] < mn) mn = arr[i];
    c++;
    if (arr[i] > mx) mx = arr[i];
  }
  return { min: mn, max: mx, comparisons: c };
}

function analyze() {
  const stocks = inventory.map(x => x.stock);
  compareCount = 0;

  const dc = divideSearch(stocks, 0, stocks.length - 1);
  const dcComp = compareCount;
  const normal = sequential(stocks);

  const minItems = inventory.filter(x => x.stock === dc.min).map(x => x.product).join(", ");
  const maxItems = inventory.filter(x => x.stock === dc.max).map(x => x.product).join(", ");

  const outputDiv = document.getElementById("output");
  outputDiv.style.display = "block";
  outputDiv.innerHTML =
    "<h3>📋 Inventory Analysis Report</h3>" +
    "<b>Lowest Stock Item:</b> " + minItems + " (" + dc.min + " Units)<br>" +
    "<b>Highest Stock Item:</b> " + maxItems + " (" + dc.max + " Units)<br><br>" +
    "<b>Divide & Conquer Comparisons:</b> " + dcComp + "<br>" +
    "<b>Sequential Scan Comparisons:</b> " + normal.comparisons;
}

loadTable();
</script>

</body>
</html>

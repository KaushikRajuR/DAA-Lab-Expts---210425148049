<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Rendering Pipeline Optimizer</title>
<style>
  :root {
    --bg-color: #fdf6f0;       /* Soft Light Peach */
    --card-bg: #ffffff;        /* Crisp White Container */
    --accent-dark: #3a2238;    /* Deep Plum / Dark Violet */
    --accent-glow: #522d50;    /* Dark Plum Hover */
    --text-primary: #2d1a2c;   /* Deep Slate-Violet Text */
    --text-muted: #735d72;     /* Soft Muted Text */
    --border-color: #f2cc8f;   /* Soft Peach Border */
    --panel-bg: #fffbf7;       /* Off-White Panel */
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: var(--bg-color);
    color: var(--text-primary);
    padding: 40px 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .wrap {
    width: 100%;
    max-width: 980px;
    background: var(--card-bg);
    border-radius: 16px;
    box-shadow: 0 12px 32px rgba(58, 34, 56, 0.08);
    border: 1px solid rgba(242, 204, 143, 0.5);
    overflow: hidden;
  }

  .hero {
    background: linear-gradient(135deg, var(--accent-dark), var(--accent-glow));
    color: #fff;
    padding: 28px 24px;
    text-align: center;
  }

  .hero h2 {
    margin: 0;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .hero p {
    margin: 8px 0 0;
    font-size: 0.95rem;
    opacity: 0.85;
    color: #f9ecec;
  }

  .grid {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
    padding: 28px;
  }

  @media (max-width: 768px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }

  .panel, .report {
    background: var(--panel-bg);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
  }

  .badge {
    display: inline-block;
    background: rgba(58, 34, 56, 0.08);
    color: var(--accent-dark);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 14px;
  }

  .stage {
    display: flex;
    justify-content: space-between;
    padding: 10px 12px;
    background: #fff;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    margin-bottom: 8px;
    font-size: 0.9rem;
    color: var(--text-primary);
  }

  label {
    display: block;
    margin-top: 16px;
    font-size: 0.9rem;
    color: var(--text-primary);
  }

  input {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: #fff;
    color: var(--text-primary);
    font-size: 0.95rem;
    font-family: inherit;
    margin-top: 8px;
    outline: none;
    transition: all 0.2s ease;
  }

  input:focus {
    border-color: var(--accent-dark);
    box-shadow: 0 0 0 3px rgba(58, 34, 56, 0.1);
  }

  button {
    width: 100%;
    margin-top: 18px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background: var(--accent-dark);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 4px 12px rgba(58, 34, 56, 0.2);
  }

  button:hover {
    background: var(--accent-glow);
    transform: translateY(-1px);
  }

  .report h3 {
    margin-bottom: 16px;
    color: var(--accent-dark);
    font-size: 1.1rem;
  }

  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 16px 0;
  }

  .box {
    background: #fff;
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--accent-dark);
    padding: 12px 16px;
    border-radius: 8px;
    font-size: 0.9rem;
    line-height: 1.6;
    color: var(--text-primary);
  }

  .table-container {
    border: 1px solid var(--border-color);
    border-radius: 10px;
    overflow: hidden;
    margin-top: 16px;
    background: #fff;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.85rem;
  }

  th {
    background: var(--accent-dark);
    color: #fff;
    padding: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    text-align: center;
  }

  td {
    padding: 10px;
    border-bottom: 1px solid rgba(242, 204, 143, 0.4);
    border-right: 1px solid rgba(242, 204, 143, 0.4);
    text-align: center;
    color: var(--text-primary);
  }

  td:last-child, th:last-child {
    border-right: none;
  }

  tr:last-child td {
    border-bottom: none;
  }

  tr:nth-child(even) {
    background: #fffbf7;
  }

  .footer {
    text-align: center;
    padding: 16px;
    background: var(--panel-bg);
    color: var(--text-muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--border-color);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <h2>🎬 Video Rendering Pipeline Optimizer</h2>
    <p>Optimize rendering stages using Dynamic Programming</p>
  </div>

  <div class="grid">
    <div class="panel">
      <span class="badge">Rendering Stages</span>
      <div class="stage"><span>Lighting</span><span>15×35</span></div>
      <div class="stage"><span>Shadow Mapping</span><span>35×25</span></div>
      <div class="stage"><span>Texture Pass</span><span>25×40</span></div>
      <div class="stage"><span>Post Processing</span><span>40×12</span></div>

      <label for="dims"><b>Pipeline Dimensions</b></label>
      <input id="dims" value="15,35,25,40,12">
      <button onclick="optimize()">Optimize Pipeline</button>
    </div>

    <div class="report" id="reportCard" style="display:none;">
      <h3>📊 Optimization Report</h3>
      <div id="output"></div>
    </div>
  </div>

  <div class="footer">Rendering Engine Optimization System</div>
</div>

<script>
function pipelineDP(d) {
  let n = d.length - 1;
  let cost = Array.from({ length: n + 1 }, () => Array(n + 1).fill(0));
  let split = Array.from({ length: n + 1 }, () => Array(n + 1).fill(0));

  for (let len = 2; len <= n; len++) {
    for (let i = 1; i <= n - len + 1; i++) {
      let j = i + len - 1;
      cost[i][j] = Infinity;
      for (let k = i; k < j; k++) {
        let c = cost[i][k] + cost[k + 1][j] + d[i - 1] * d[k] * d[j];
        if (c < cost[i][j]) {
          cost[i][j] = c;
          split[i][j] = k;
        }
      }
    }
  }
  return { cost, split, n };
}

function order(s, i, j) {
  if (i == j) return "Stage " + i;
  let k = s[i][j];
  return "(" + order(s, i, k) + " → " + order(s, k + 1, j) + ")";
}

function optimize() {
  const dims = document.getElementById("dims").value.split(",").map(Number);
  const r = pipelineDP(dims);

  let html = `<div class="summary">
    <div class="box"><b>Minimum Rendering Cost</b><br>${r.cost[1][r.n].toLocaleString()}</div>
    <div class="box"><b>Pipeline Stages</b><br>${r.n} Stages</div>
  </div>`;

  html += `<div class="box"><b>Best Execution Sequence</b><br>${order(r.split, 1, r.n)}</div>`;

  html += `<div class="table-container"><table><tr><th></th>`;
  for (let i = 1; i <= r.n; i++) html += `<th>Stage ${i}</th>`;
  html += "</tr>";

  for (let i = 1; i <= r.n; i++) {
    html += `<tr><th>Stage ${i}</th>`;
    for (let j = 1; j <= r.n; j++) {
      html += `<td>${j < i ? "-" : r.cost[i][j].toLocaleString()}</td>`;
    }
    html += "</tr>";
  }
  html += "</table></div>";

  document.getElementById("output").innerHTML = html;
  document.getElementById("reportCard").style.display = "block";
}
</script>

</body>
</html>
